name: MEDIC checks

on:
  push:
  pull_request:

jobs:
  standard-library-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Check role contract
        run: python medic_control.py --role-contract --json
